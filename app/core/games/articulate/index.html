<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articulate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-bg="lobby">
  <!-- Almost black with faint diagonal lines behind everything -->
  <div class="backdrop" aria-hidden="true"></div>
  <div id="texName" class="tex-name hidden"></div>

  <div id="stage" class="stage">

    <!-- Lobby: players on the left, join info + logo on the right -->
    <section id="lobby" class="screen lobby active">
      <div id="lobbyPlayers" class="lobby-players"></div>
      <div class="lobby-side">
        <div class="join-at">Join at <b id="joinUrl">barcodegames.fun</b></div>
        <h1 id="logo" class="logo"></h1>
        <div class="room-code">
          <span>Room code</span>
          <b id="roomCode"></b>
        </div>
      </div>
    </section>

    <!-- 3, 2, 1 before the game starts -->
    <div id="countdown" class="countdown hidden"></div>

    <!-- Game: picking, drawing, turn results -->
    <section id="game" class="screen game">
      <div id="round" class="round panel"></div>
      <div class="status"><span class="rule"></span><span id="status" class="status-text fit"></span><span class="rule"></span></div>
      <div id="timer" class="timer panel"></div>
      <aside id="players" class="players"></aside>
      <div class="board">
        <canvas id="canvas"></canvas>
        <div id="overlay" class="overlay hidden"></div>
      </div>
      <div id="hint" class="hint panel"></div>
      <aside id="feed" class="feed"></aside>
    </section>

    <!-- Winners -->
    <section id="win" class="screen win">
      <div class="win-head"><span class="rule"></span><span id="trophy" class="trophy"></span><span class="rule"></span></div>
      <h1 id="winTitle" class="win-title fit"></h1>
      <div id="podium" class="podium"></div>
    </section>

  </div>

  <script src="../../shared/room-host.js"></script>
  <script src="js/board.js"></script>
  <script src="js/words.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/view.js"></script>
  <script src="js/game.js"></script>
</body>

</html>
