<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiggle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #121212;
      overflow: hidden;
      user-select: none;
      position: relative;
      perspective: 1200px;
    }

    #bgLayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bg-slice {
      height: 100%;
      width: auto;
      flex-shrink: 0;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .grid-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      perspective: 1200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, auto);
      grid-template-rows: repeat(2, auto);
      column-gap: clamp(30px, 4.5vw, 65px);
      row-gap: clamp(20px, 3.5vh, 45px);
      align-items: center;
      justify-items: center;
      padding: 20px;
      transform-style: preserve-3d;
    }

    .letter-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 135px;
      height: 135px;
      cursor: pointer;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .letter-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }

    .letter-slot:hover .letter-wrapper {
      transform: scale(1.06);
    }

    .shadow-slot {
      position: absolute;
      top: 15px;
      left: -52px;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      transform-style: preserve-3d;
    }

    .letter-shadow {
      height: 92px;
      width: auto;
      max-width: 105px;
      object-fit: contain;
      pointer-events: none;
      filter: brightness(0);
      opacity: 0.38;
      transform-origin: center center;
      transform: rotateY(24deg) rotateX(6deg);
      will-change: transform;
      transition: opacity 0.4s ease;
    }

    .main-slot {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
      transform-style: preserve-3d;
    }

    .token-3d {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d !important;
      transform-origin: center center;
      transform: rotateY(24deg) rotateX(6deg);
      will-change: transform;
    }

    .layer-slice {
      position: absolute;
      height: 125px;
      width: auto;
      max-width: 135px;
      object-fit: contain;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform;
    }

    .face-front {
      transform: translateZ(10px);
      backface-visibility: hidden;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .face-back {
      transform: rotateY(180deg) scaleX(-1) translateZ(10px);
      backface-visibility: hidden;
      z-index: 10;
      opacity: 0.68;
    }

    .edge-slice {
      opacity: 1;
      pointer-events: none;
      backface-visibility: visible;
      transition: opacity 0.35s ease;
    }

    @keyframes cartoon-wiggle-3d {
      0% {
        transform: rotateY(28deg) rotateX(8deg) rotateZ(-4deg);
      }

      50% {
        transform: rotateY(16deg) rotateX(2deg) rotateZ(4deg);
      }

      100% {
        transform: rotateY(28deg) rotateX(8deg) rotateZ(-4deg);
      }
    }

    .wiggle {
      animation: cartoon-wiggle-3d 3s ease-in-out infinite alternate;
    }

    @keyframes death-spin-3d {
      0% {
        transform: rotateY(24deg) rotateX(6deg) scale(1);
      }

      50% {
        transform: rotateY(102deg) rotateX(3deg) scale(1.12);
      }

      100% {
        transform: rotateY(180deg) rotateX(0deg) rotateZ(0deg) scale(1);
      }
    }

    @keyframes revive-spin-3d {
      0% {
        transform: rotateY(180deg) rotateX(0deg) rotateZ(0deg) scale(1);
      }

      50% {
        transform: rotateY(282deg) rotateX(3deg) scale(1.12);
      }

      100% {
        transform: rotateY(384deg) rotateX(6deg) scale(1);
      }
    }

    .death-spinning {
      animation: death-spin-3d 1.5s cubic-bezier(0.76, 0, 0.24, 1) forwards !important;
    }

    .revive-spinning {
      animation: revive-spin-3d 0.85s cubic-bezier(0.76, 0, 0.24, 1) forwards !important;
    }

    .is-dead-state {
      transform: rotateY(180deg) rotateX(0deg) rotateZ(0deg) !important;
    }

    .dying-fade .edge-slice,
    .is-dead-state .edge-slice {
      opacity: 0 !important;
      transition: opacity 0.15s ease;
    }

    .dying-fade .face-front,
    .is-dead-state .face-front {
      opacity: 0 !important;
      transition: opacity 0.15s ease;
    }
  </style>
</head>

<body>
  <audio id="lampAudio" src="lamp.mp3" loop preload="auto"></audio>
  <audio id="horrorAudio" src="horror.mp3" loop preload="auto"></audio>

  <div id="bgLayer"></div>

  <div class="grid-container">
    <div class="grid" id="letterGrid"></div>
  </div>

  <script>
    const bgLayer = document.getElementById('bgLayer');
    function setupBackground() {
      bgLayer.innerHTML = '';
      const sliceAspect = 3844 / 6968;
      const sliceWidth = window.innerHeight * sliceAspect;
      const count = Math.ceil(window.innerWidth / sliceWidth) + 1;

      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        img.src = 'background.png';
        img.className = 'bg-slice';
        img.alt = '';
        bgLayer.appendChild(img);
      }
    }

    window.addEventListener('resize', setupBackground);
    setupBackground();

    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const grid = document.getElementById('letterGrid');
    const TOTAL_LETTERS = 8;

    const assetCache = {};

    function bakeTexture(imgElement, filterString, padding = 16) {
      if (!imgElement || imgElement.naturalWidth === 0) {
        return imgElement ? imgElement.src : '';
      }
      try {
        const nw = imgElement.naturalWidth || 260;
        const nh = imgElement.naturalHeight || 260;
        const maxDim = 260;
        let targetW, targetH;

        if (nw > nh) {
          targetW = maxDim;
          targetH = Math.round((nh / nw) * maxDim);
        } else {
          targetH = maxDim;
          targetW = Math.round((nw / nh) * maxDim);
        }

        const pad = padding;
        const canvas = document.createElement('canvas');
        canvas.width = targetW + pad * 2;
        canvas.height = targetH + pad * 2;
        const ctx = canvas.getContext('2d');
        ctx.filter = filterString;
        ctx.drawImage(imgElement, pad, pad, targetW, targetH);
        return canvas.toDataURL('image/png');
      } catch (err) {
        return imgElement.src;
      }
    }

    function bakeBlinkTexture(imgElement, filterString, padding = 16) {
      if (!imgElement || imgElement.naturalWidth === 0) {
        return imgElement ? imgElement.src : '';
      }
      try {
        const nw = imgElement.naturalWidth || 260;
        const nh = imgElement.naturalHeight || 260;
        const maxDim = 260;
        let targetW, targetH;

        if (nw > nh) {
          targetW = maxDim;
          targetH = Math.round((nh / nw) * maxDim);
        } else {
          targetH = maxDim;
          targetW = Math.round((nw / nh) * maxDim);
        }

        const pad = padding;
        const canvas = document.createElement('canvas');
        canvas.width = targetW + pad * 2;
        canvas.height = targetH + pad * 2;
        const ctx = canvas.getContext('2d');
        ctx.filter = filterString;
        ctx.drawImage(imgElement, pad, pad, targetW, targetH);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] > 100 && data[i] > 195 && data[i + 1] > 195 && data[i + 2] > 195) {
            data[i] = 18;
            data[i + 1] = 18;
            data[i + 2] = 22;
          }
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas.toDataURL('image/png');
      } catch (err) {
        return imgElement.src;
      }
    }

    function getRandomLetters(count) {
      const shuffled = [...alphabet].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function playEchoBell() {
      const bell1 = new Audio('bell.mp3');
      bell1.volume = 1.0;
      bell1.play().catch(() => {});

      setTimeout(() => {
        const bell2 = new Audio('bell.mp3');
        bell2.volume = 0.36;
        bell2.play().catch(() => {});
      }, 180);

      setTimeout(() => {
        const bell3 = new Audio('bell.mp3');
        bell3.volume = 0.12;
        bell3.play().catch(() => {});
      }, 360);
    }

    let groupBlinkTimeout = null;

    function renderLetters() {
      grid.innerHTML = '';
      const letters = getRandomLetters(TOTAL_LETTERS);
      const activeAliveLetters = [];

      letters.forEach((letter) => {
        let isDead = false;
        const randomHue = Math.floor(Math.random() * 360);

        const slot = document.createElement('div');
        slot.className = 'letter-slot';

        const wrapper = document.createElement('div');
        wrapper.className = 'letter-wrapper';

        const duration = (2.6 + Math.random() * 0.8).toFixed(2);
        const delay = (-(Math.random() * 3.0)).toFixed(2);

        const shadowSlot = document.createElement('div');
        shadowSlot.className = 'shadow-slot';

        const shadowImg = document.createElement('img');
        shadowImg.src = `Letters2/${letter}.png`;
        shadowImg.alt = '';
        shadowImg.className = 'letter-shadow wiggle';
        shadowImg.style.animationDuration = `${duration}s`;
        shadowImg.style.animationDelay = `${delay}s`;
        shadowSlot.appendChild(shadowImg);

        const mainSlot = document.createElement('div');
        mainSlot.className = 'main-slot';

        const token3D = document.createElement('div');
        token3D.className = 'token-3d wiggle';
        token3D.style.animationDuration = `${duration}s`;
        token3D.style.animationDelay = `${delay}s`;

        const aliveAsset = assetCache[`alive_${letter}`] || new Image();
        const deadAsset = assetCache[`dead_${letter}`] || new Image();

        const frontTexture = bakeTexture(aliveAsset, `saturate(0.82) brightness(1.14) hue-rotate(${randomHue}deg)`, 16);
        const blinkTexture = bakeBlinkTexture(aliveAsset, `saturate(0.82) brightness(1.14) hue-rotate(${randomHue}deg)`, 16);
        const edgeTexture = bakeTexture(aliveAsset, `drop-shadow(0 0 1.2px #652224) brightness(0.72) contrast(1.12) saturate(0.85) hue-rotate(${randomHue}deg)`, 16);
        const deadTexture = bakeTexture(deadAsset, `drop-shadow(0 0 4px rgba(240, 70, 80, 0.95)) drop-shadow(0 0 14px rgba(220, 55, 65, 0.9)) drop-shadow(0 0 28px rgba(220, 55, 65, 0.75)) saturate(0.28) brightness(1.28) hue-rotate(${randomHue}deg)`, 34);

        for (let z = -9.5; z <= 9.5; z += 0.75) {
          const slice = document.createElement('img');
          slice.src = edgeTexture;
          slice.alt = '';
          slice.className = 'layer-slice edge-slice';
          slice.style.transform = `translateZ(${z.toFixed(1)}px)`;
          token3D.appendChild(slice);
        }

        const frontImg = document.createElement('img');
        frontImg.src = frontTexture;
        frontImg.alt = letter;
        frontImg.className = 'layer-slice face-front';
        token3D.appendChild(frontImg);

        const backImg = document.createElement('img');
        backImg.src = deadTexture;
        backImg.alt = `${letter} Dead`;
        backImg.className = 'layer-slice face-back';
        token3D.appendChild(backImg);

        mainSlot.appendChild(token3D);
        wrapper.appendChild(shadowSlot);
        wrapper.appendChild(mainSlot);
        slot.appendChild(wrapper);
        grid.appendChild(slot);

        activeAliveLetters.push({
          frontImg,
          frontTexture,
          blinkTexture,
          isAlive: () => !isDead && !isFlipping
        });

        let isFlipping = false;
        slot.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isFlipping) return;
          isFlipping = true;

          if (!isDead) {
            frontImg.src = frontTexture;
            setTimeout(() => {
              const whoosh = new Audio('whoosh.mp3');
              whoosh.play().catch(() => {});
            }, 200);

            token3D.classList.remove('wiggle', 'revive-spinning');
            token3D.classList.add('death-spinning');

            shadowImg.classList.remove('wiggle', 'revive-spinning');
            shadowImg.classList.add('death-spinning');
            shadowImg.style.opacity = '0.18';

            setTimeout(() => {
              const ghost = new Audio('ghost.mp3');
              ghost.volume = 0.28;
              ghost.play().catch(() => {});
            }, 750);

            setTimeout(() => {
              token3D.classList.add('dying-fade');
              shadowImg.src = `Letters2-Dead/${letter}.png`;
            }, 900);

            setTimeout(() => {
              playEchoBell();
            }, 1500);

            setTimeout(() => {
              token3D.classList.remove('death-spinning', 'dying-fade');
              token3D.classList.add('is-dead-state');

              shadowImg.classList.remove('death-spinning');
              shadowImg.classList.add('is-dead-state');

              isDead = true;
              isFlipping = false;
            }, 1500);
          } else {
            token3D.classList.remove('is-dead-state', 'dying-fade', 'death-spinning');
            token3D.classList.add('revive-spinning');

            shadowImg.classList.remove('is-dead-state', 'death-spinning');
            shadowImg.classList.add('revive-spinning');

            setTimeout(() => {
              shadowImg.src = `Letters2/${letter}.png`;
              shadowImg.style.opacity = '0.38';
            }, 425);

            setTimeout(() => {
              token3D.classList.remove('revive-spinning');
              token3D.classList.add('wiggle');

              shadowImg.classList.remove('revive-spinning');
              shadowImg.classList.add('wiggle');

              isDead = false;
              isFlipping = false;
            }, 850);
          }
        });
      });

      function startGroupBlinkDirector() {
        if (groupBlinkTimeout) clearTimeout(groupBlinkTimeout);
        function nextTick() {
          const delay = 1100 + Math.random() * 1600;
          groupBlinkTimeout = setTimeout(() => {
            const available = activeAliveLetters.filter((item) => item.isAlive());
            if (available.length > 0) {
              const count = Math.random() < 0.25 ? Math.min(2, available.length) : 1;
              const shuffled = [...available].sort(() => 0.5 - Math.random());
              for (let i = 0; i < count; i++) {
                const chosen = shuffled[i];
                setTimeout(() => {
                  if (!chosen.isAlive()) return;
                  chosen.frontImg.src = chosen.blinkTexture;
                  setTimeout(() => {
                    chosen.frontImg.src = chosen.frontTexture;
                    if (Math.random() < 0.28) {
                      setTimeout(() => {
                        if (chosen.isAlive()) {
                          chosen.frontImg.src = chosen.blinkTexture;
                          setTimeout(() => {
                            chosen.frontImg.src = chosen.frontTexture;
                          }, 110);
                        }
                      }, 70);
                    }
                  }, 130);
                }, i * 180);
              }
            }
            nextTick();
          }, delay);
        }
        nextTick();
      }
      startGroupBlinkDirector();
    }

    const lampAudio = document.getElementById('lampAudio');
    const horrorAudio = document.getElementById('horrorAudio');
    let audioCtx = null;

    function startAudio() {
      lampAudio.playbackRate = 0.88;
      if (!audioCtx) {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          const source = audioCtx.createMediaElementSource(lampAudio);
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 1.65;
          source.connect(gainNode);
          gainNode.connect(audioCtx.destination);
        } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      if (lampAudio && lampAudio.paused) {
        lampAudio.play().catch(() => {});
      }
      if (horrorAudio && horrorAudio.paused) {
        horrorAudio.volume = 0.85;
        horrorAudio.play().catch(() => {});
      }
      scheduleRandomWind();
      scheduleRandomGhost();
    }

    let windScheduled = false;
    function scheduleRandomWind() {
      if (windScheduled) return;
      windScheduled = true;
      function triggerWind() {
        const delay = 8000 + Math.random() * 18000;
        setTimeout(() => {
          const wind = new Audio('wind.mp3');
          wind.volume = 0.35 + Math.random() * 0.45;
          wind.playbackRate = 0.88 + Math.random() * 0.25;
          wind.play().catch(() => {});
          triggerWind();
        }, delay);
      }
      triggerWind();
    }

    let ghostScheduled = false;
    function scheduleRandomGhost() {
      if (ghostScheduled) return;
      ghostScheduled = true;
      function triggerGhost() {
        const delay = 12000 + Math.random() * 24000;
        setTimeout(() => {
          const ghost = new Audio('ghost.mp3');
          ghost.volume = 0.35 + Math.random() * 0.4;
          ghost.playbackRate = 0.9 + Math.random() * 0.2;
          ghost.play().catch(() => {});
          triggerGhost();
        }, delay);
      }
      triggerGhost();
    }

    startAudio();

    ['click', 'keydown', 'touchstart', 'pointerdown'].forEach((evt) => {
      window.addEventListener(evt, startAudio, { passive: true });
    });

    window.addEventListener('click', renderLetters);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        renderLetters();
      }
    });

    async function init() {
      const promises = [];
      alphabet.forEach((char) => {
        const alive = new Image();
        alive.src = `Letters2/${char}.png`;
        assetCache[`alive_${char}`] = alive;
        if (alive.decode) {
          promises.push(alive.decode().catch(() => {}));
        }

        const dead = new Image();
        dead.src = `Letters2-Dead/${char}.png`;
        assetCache[`dead_${char}`] = dead;
        if (dead.decode) {
          promises.push(dead.decode().catch(() => {}));
        }
      });

      await Promise.all(promises);
      renderLetters();
    }

    init();
  </script>
</body>

</html>
