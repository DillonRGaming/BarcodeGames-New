<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>BarcodeGames</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/join.css">
</head>

<body>
  <!-- Join screen: shared by every game -->
  <div id="joinScreen" class="join-screen">
    <header class="topbar">
      <img class="logo" src="shared/logo.png" alt="BarcodeGames">
    </header>

    <form id="joinForm" class="join-form" autocomplete="off" novalidate>
      <label class="field">
        <span class="field-label">Room code <span id="gameName" class="field-extra"></span></span>
        <span class="input-wrap">
          <input id="codeInput" maxlength="4" autocapitalize="characters" spellcheck="false"
            placeholder="ENTER 4-LETTER CODE" required>
          <span id="codeStatus" class="code-status" aria-hidden="true"></span>
        </span>
      </label>

      <label class="field">
        <span class="field-label">Name <span id="nameCount" class="field-extra">12</span></span>
        <span class="input-wrap">
          <input id="nameInput" maxlength="12" autocapitalize="characters" spellcheck="false"
            placeholder="ENTER YOUR NAME" required>
        </span>
      </label>

      <p id="joinError" class="join-error" role="alert"></p>

      <button id="joinBtn" class="join-btn" type="submit" disabled>Play</button>
    </form>
  </div>

  <!-- Game controller: each game mounts its own UI here -->
  <main id="gameScreen" class="game-screen hidden"></main>

  <!-- Connection notice (shared) -->
  <div id="notice" class="notice hidden" role="status"></div>

  <script src="shared/room-client.js"></script>
  <script src="games/games.js"></script>
  <script src="shared/join.js"></script>
</body>

</html>
